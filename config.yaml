# Channel settings. No secrets in this file (they live in .env).

channel_name: "CHANNEL NAME"        # replace with your channel name
channel_handle: "@yourhandle"
timezone: "Europe/London"           # IANA name; all schedules below use this zone
launch_date: "2026-11-19"           # Writer also runs after every intake for 14 days from this date

# Owner approval gate. While true, a Reviewer-approved video waits for
# `python -m scripts.approve <id>` before upload.py will publish it.
# Turn off only once you trust the output.
require_owner_ok: true

# Upload slots (local time). upload.py publishes at most one video per slot.
posting_times: ["12:00", "17:00", "20:00"]
max_uploads_per_day: 6              # YouTube Data API default quota allows about 6 uploads/day
daily_target: 3                     # Writer produces at most this many scripted rows per day
synthetic_content_disclosure: true  # sets status.containsSyntheticMedia (AI narration voice)
category_id: "20"                   # YouTube category 20 = Gaming
default_language: "en"

# Agents
models:
  default: "claude-opus-5-5"
effort:                             # low | medium | high | xhigh | max
  scout: "medium"
  writer: "high"
  editor: "medium"
  reviewer: "high"
  analyst: "medium"
agent_max_turns: 40

# Transcription (faster-whisper). Use "cuda" if you have an NVIDIA GPU; CPU is slow on long streams.
whisper:
  model: "small"
  device: "cpu"
  compute_type: "int8"

# Download limits for intake.py
intake:
  max_height: 1080
  max_age_hours: 72                 # ignore VODs older than this

# Text-to-speech
tts:
  provider: "elevenlabs"            # elevenlabs | flite (offline robot voice, previews only) | test (tone)
  voice_id: ""                      # your ElevenLabs voice id
  model_id: "eleven_multilingual_v2"
  flite_voice: "slt"                # only for provider: flite

# Rendering
render:
  width: 1080
  height: 1920
  fps: 30
  loudness_lufs: -14
  font: "DejaVu Sans"
  min_seconds: 20
  max_seconds: 45
  sfx_dir: "assets/sfx"             # approved sound-effect library: only files in here may be used
  hook_position: "middle"           # middle (centre of frame, clear of the facecam) | top

# Background music. Only put tracks in the folder that you are licensed to use on YouTube
# (see assets/music/README.md). With no tracks in the folder, videos render without music.
music:
  enabled: true
  dir: "assets/music"
  volume_db: -22                    # music level under the game audio
  duck_under_narration_db: -8       # extra dip while the voice-over speaks

# Three layouts, rotated so no two consecutive videos share one.
layouts:
  crop:        "Full-height crop of the gameplay around focus_x."
  facecam_top: "Creator facecam stacked above a gameplay crop (needs a facecam region; else falls back to crop)."
  blur_fit:    "Whole gameplay frame fitted to width over a blurred, zoomed copy of itself."

# Escalation thresholds
alerts:
  underperform_ratio: 0.5           # three consecutive videos under this x channel median
  underperform_run: 3
  tool_outage_hours: 6
